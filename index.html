<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Randy’s Daily Puzzle</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <header>
        <p class="eyebrow">A small daily ritual</p>
        <h1>Randy’s Daily Puzzle</h1>
        <p id="subtitle">Loading today’s puzzle…</p>
        <button id="archive-toggle" class="secondary archive-toggle" type="button">Play another day</button>
      </header>

      <section id="archive-panel" class="archive-panel hidden">
        <label for="puzzle-date">Choose a previous day</label>
        <div class="archive-actions">
          <input id="puzzle-date" type="date" />
          <button id="date-button" type="button">Play date</button>
          <button id="random-button" class="secondary" type="button">Random day</button>
        </div>
      </section>

      <section id="game-card" class="card" aria-live="polite">
        <div id="board" class="board" aria-label="Word puzzle board"></div>
        <p id="message" class="message"></p>
        <div id="game-keyboard" class="game-keyboard" aria-label="Word puzzle keyboard"></div>
        <p class="keyboard-note">Uncolored letters have not been used yet.</p>
      </section>

      <section id="results-card" class="card hidden">
        <p class="eyebrow">Today’s results</p>
        <h2 id="result-heading"></h2>
        <p id="result-copy"></p>
        <div id="stats" class="stats"></div>
        <button id="play-again" class="secondary">View the board</button>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
